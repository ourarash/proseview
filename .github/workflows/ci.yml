name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows has no pty/fcntl, so the terminal is unavailable there and
          # the rest of the app has to work without it. Neither maintainer runs
          # Windows, so without this leg the support silently rots.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install proseview
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  epubcheck:
    # The EPUB tests run EPUBCheck, the validator the stores use, when it is
    # installed. Writers never install Java, so this is where it runs.
    name: EPUBCheck
    runs-on: ubuntu-latest
    env:
      EPUBCHECK_VERSION: "5.2.1"
      PROSEVIEW_REQUIRE_EPUBCHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install EPUBCheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Install proseview
        run: pip install -e ".[dev]"
      - name: Run the EPUB tests with EPUBCheck
        run: pytest -q -rs tests/test_epub.py tests/test_export_dashboard.py tests/test_matter.py tests/test_styles.py tests/test_raw_html.py

  browser-e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e_browser -q
