name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install proseview
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  # The browser end-to-end tier is opt-in locally (`pytest -m e2e_browser`).
  # Uncomment to gate it on every PR. It adds ~1 minute plus a Chromium
  # download; PROSEVIEW_ESM_OFFLINE=1 makes a stale esm cache fail loudly
  # rather than silently refetching from the network.
