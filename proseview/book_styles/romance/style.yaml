# Romance: a chapter title in a script face (Great Vibes) under a numeral framed by floral
# ornaments, a drop cap, and a floral mark between scenes. It builds on
# Classic: epub.css here is added after Classic's, and the PDFs use Classic's
# layout with the choices under pdf: below.
name: Romance
description: Chapter titles in a flowing script, numerals framed by florals, a floral mark between scenes.
extends: classic
chapter_numbering: number
scene_break: "❦"
pdf:
  opener: romance
  ornament: "❦"
  title_font: Great Vibes
# A script face e-readers will not have, so the EPUB carries it.
epub_fonts: [GreatVibes-Regular.ttf]
