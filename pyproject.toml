[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proseview"
version = "0.1.2"
description = "A local dashboard and AI harness for Markdown-first novel repositories."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ari Saif" }]
requires-python = ">=3.11"
keywords = ["writing", "novel", "markdown", "dashboard", "lexical-analysis", "prose"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.5",
]
# Browser end-to-end tier. Required in CI, opt-in locally:
# `pip install -e ".[e2e]" && playwright install chromium`.
# The HTTP end-to-end tier under tests/e2e/ needs none of this -- it is stdlib only.
e2e = [
    "pytest>=7",
    "playwright>=1.44",
    "pytest-playwright>=0.5",
    "pytest-xdist>=3.5",
]

[project.urls]
Homepage = "https://github.com/ourarash/proseview"
Source = "https://github.com/ourarash/proseview"
Issues = "https://github.com/ourarash/proseview/issues"

[project.scripts]
proseview = "proseview.cli:main"

[tool.setuptools.packages.find]
include = ["proseview*"]
exclude = ["tests*", "fixtures*"]

[tool.setuptools.package-data]
proseview = [
    "templates/*.j2",
    "templates/assets/*",
    "templates/assets/js/*",
    "templates/assets/themes/*",
    "templates/vendor/*",
    "templates/vendor/pm/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tier needs Playwright plus a Chromium download, so it is excluded
# from the default run. Opt in with `pytest -m e2e_browser` (or `-m ""` for all).
#
# Both tiers run in parallel with pytest-xdist, which is worth using:
#
#     pytest -n 4                      # unit + HTTP, 18s -> 12s
#     pytest -m e2e_browser -n 4       # browser tier, 144s -> 44s
#
# `-n` is deliberately not in addopts. A fixed number is wrong on a machine
# with a different core count, and `-n auto` is actively worse here: every
# worker starts its own server subprocess and Chromium, so on this 14-core
# machine `auto` oversubscribes badly. Measured on 14 cores, `-n 4` was clean
# across repeated runs while `-n 8` intermittently lost timing-sensitive tests
# in the selection and conversation-history clusters. Pick the number for the
# machine, and treat a failure that only appears at higher `-n` as a real
# timing bug rather than a reason to lower it silently.
addopts = "-m 'not e2e_browser'"
markers = [
    "e2e_browser: end-to-end test driving a real browser via Playwright",
    "allow_js_errors(*substrings): tolerate matching console/page errors in a browser test",
    "allow_http_errors(*substrings): tolerate 5xx responses from matching URLs in a browser test",
]
