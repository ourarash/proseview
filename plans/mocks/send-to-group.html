<body>
<header class="prototype-bar">
  <div class="prototype-title"><span class="prototype-label">Clickable proposal</span> <strong>Proseview / Send to Group</strong></div>
  <nav class="prototype-nav" aria-label="Prototype screens"><button data-action="source">Source chat</button><button data-action="setup">Fork setup</button><button data-action="native-group">Group tab</button><button data-action="reset">Reset</button></nav>
  <label class="sr-only" for="context-example">Prototype context example</label>
  <select class="prototype-scenario" id="context-example"><option value="fits">Example: context fits</option><option value="long">Example: context too long</option></select>
</header>
<div id="app"></div>
<dialog id="setup" aria-labelledby="setup-title"></dialog>
<dialog id="preset-options" class="preset-option-dialog" aria-labelledby="options-title"></dialog>
<dialog id="context" class="context-dialog" aria-labelledby="context-title"></dialog>
<dialog id="proposal" aria-labelledby="proposal-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Local prototype: manuscript, model responses, and session states are illustrative.
// One Group library separates conversation workflows from task presets. Setup filters to workflows; Group shows both. Cards, options, and execution are shared.
const GROUP_LIBRARY = [
  {id:'second_opinion',kind:'workflow',name:'Second opinion & recap',description:'Another agent weighs in, the original responds, then a recap.',positions:false},
  {id:'editorial_critique',kind:'task',name:'Editorial critique',description:'Structure and stakes meet voice, atmosphere, and subtext.',positions:false},
  {id:'tough_love',kind:'task',name:'Trim & tighten',description:'Cut repetition while preserving concrete detail and subtext.',positions:false}
];
const $ = selector => document.querySelector(selector);
const esc = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const providerName = p => p==='claude'?'Claude':'Codex';
const scenePath='manuscript/ch04/02-the-last-ferry.md';
const scene=`1  By morning, the city would expect an answer.
2  The kettle clicked off. Neither of them moved to pour it.
3  Beyond the glass, the harbor lights shivered in the rain.
10 Mara stood at the kitchen door with her coat half on.
12 “If I miss the last ferry, they’ll search the house,” she said.
14 Her brother looked at the empty place on the wall where the clock had been.
15 “You could have told me.”
18 She touched the envelope in her pocket. She pressed its corners flat.
20 “I’m telling you now.”
23 He set his cup down very carefully. The harbor bell sounded once, then again.
27 She took the stairs two at a time.
28 For once, the city could wait.`;
const sourceFiles=[
  {path:scenePath,body:scene},
  {path:'manuscript/ch04/01-the-promise.md',body:'“By morning,” the clerk said, “the city will expect an answer.”\nMara signed her name. She kept the second copy for her brother.'},
  {path:'notes/characters/mara.md',body:'Mara is protecting her brother. Her departure should feel urgent but restrained. The city represents the obligation she is leaving behind.'}
];
const tools=[{name:'read_file',path:'manuscript/ch04/01-the-promise.md',output:sourceFiles[1].body},{name:'read_file',path:'notes/characters/mara.md',output:sourceFiles[2].body}];
const sourceSettings={provider:'claude',model:'default',custom:''};
let nextId=0, S, toastTimer;
function fullPrompt(question){return `You are Proseview's writing assistant. Discuss the writer's manuscript and preserve its established voice.\n\nQUESTION\n${question}\n\nATTACHED SCENES AND FILES — CURRENT CONTENTS\n${sourceFiles.map(f=>f.path+'\n'+f.body).join('\n\n')}\n\nTOOL RESULTS\n${tools.map(t=>t.name+' '+t.path+'\n'+t.output).join('\n\n')}`;}
function userMessage(text,time){return {id:'m'+(++nextId),role:'user',text,time,prompt:fullPrompt(text)};}
function agentMessage(text,time){return {id:'m'+(++nextId),role:'assistant',provider:'claude',model:'Project default',text,time};}
function initial(){nextId=0;return {view:'source',providers:['claude','codex'],models:['default','default'],custom:['',''],workflow:'none',contextTooLong:false,optionPreset:null,group:null,fork:null,native:null,menu:false,source:[
  userMessage('Mara is leaving to protect her brother. Keep the tone quiet and the choice unresolved.','10:35'),
  agentMessage('I’ll keep the pressure on her private choice and preserve the tension with the city.','10:35'),
  userMessage('Review the departure and the ending. The current scene, the earlier promise, and Mara’s notes are attached.','10:41'),
  agentMessage('My three suggestions:\n\n1. End on the stairs. The final sentence may explain a choice the action already makes.\n2. Cut the envelope gesture. The coat already carries her nervousness.\n3. Make the departure deadline explicit so we understand the consequence of waiting.','10:42'),
  userMessage('I’m not sure about cutting the last line. Does it earn the callback?','10:46'),
  agentMessage('I’d keep the final city callback: the earlier promise gives it weight. I’d also keep one envelope gesture and cut only the repeated handling. Those are refinements to my earlier suggestions, rather than a fresh review.','10:46')
]};}
S=initial();
function avatar(p){return `<span class="avatar ${p}">${p==='writer'?'A':p==='claude'?'Cl':'Cx'}</span>`;}
function format(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split(/\n\s*\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');}
function visibleText(raw){return raw.split('\n').filter(line=>!/^STANCE\s*\|/.test(line)).join('\n').trim();}
function modelName(g,i){return g.models[i]==='custom'?g.custom[i]:'Project default';}
function handle(g,i){return providerName(g.providers[i])+(g.providers[0]===g.providers[1]?' '+(i+1):'');}
function message(m,history=false){const human=m.role==='user';const label=human?'You':providerName(m.provider);return `<article class="message" id="msg-${m.id}"><div class="message-head">${avatar(human?'writer':m.provider)}<strong>${label}</strong>${human?'':`<span class="muted small">${esc(m.model)}</span>`}<time style="margin-left:auto">${m.time||''}</time></div><div class="${human?'user-bubble':'message-body'}">${format(human?m.text:visibleText(m.text))}</div>${human&&m.prompt?`<button class="link small" style="margin-top:7px" data-action="context" data-request="${m.id}" data-history="${history}">Context inspector ↗</button>`:''}</article>`;}
function contextBundle(){return {messages:structuredClone(S.source),files:structuredClone(sourceFiles),tools:structuredClone(tools)};}
function sourceDock(){return `<div class="dock-context"><span class="dot"></span><span>${scenePath}</span>${S.fork?'<button class="link source-group-link" data-action="open-fork">Group ↗</button>':''}</div><div class="chat-scroll" id="chat-scroll"><div class="day-divider">Today</div><details class="source-history"><summary>${S.source.length-2} earlier messages</summary>${S.source.slice(0,-2).map(m=>message(m)).join('')}</details>${S.source.slice(-2).map(m=>message(m)).join('')}<div class="proposal row spread"><span><strong>Rewrite proposal · awaiting your decision</strong><br><span class="muted">This pending item belongs to the source chat.</span></span><button class="link small" data-action="proposal">View</button></div></div><form id="source-form" class="composer"><label class="sr-only" for="source-input">Message Claude</label><textarea id="source-input" placeholder="Ask anything about your story…"></textarea><div class="composer-tools"><span class="small muted">Claude · project default</span><button type="button" style="margin-left:auto" data-action="setup">↗ &nbsp; Send to Group</button><button class="primary" aria-label="Send source message">↑</button></div></form>`;}
function history(g){if(!g.forked)return '';return `<details class="inherited"><summary>Forked conversation <span class="history-count">· ${g.context.messages.length} messages · author and model preserved</span></summary><div class="inherited-inner">${g.context.messages.map(m=>message(m,true)).join('')}</div></details>`;}
function presetCards(selected,location,kind,includeNone=false){
  const entries=GROUP_LIBRARY.filter(p=>p.kind===kind);
  const none=includeNone?`<div class="preset-row"><button type="button" role="radio" aria-checked="${selected==='none'}" class="preset-card" data-action="select-preset" data-location="${location}" data-preset="none"><span class="preset-radio" aria-hidden="true"></span><span class="preset-card-copy"><strong>None — I’ll direct it</strong><span class="preset-description">No agent runs until you tag one.</span></span></button></div>`:'';
  return `<div class="preset-list" role="radiogroup" aria-label="${location==='setup'?'Setup conversation workflows':kind==='workflow'?'Group conversation workflows':'Group task presets'}">${none}${entries.map(p=>`<div class="preset-row" data-library-id="${p.id}"><button type="button" role="radio" aria-checked="${selected===p.id}" class="preset-card" data-action="select-preset" data-location="${location}" data-preset="${p.id}"><span class="preset-radio" aria-hidden="true"></span><span class="preset-card-copy"><strong>${p.name}</strong><span class="preset-description" title="${esc(p.description)}">${p.description}</span><span class="preset-recap">Recap: ${p.positions?'summary + positions table':'summary'}</span></span></button><button type="button" class="preset-settings" data-action="preset-options" data-preset="${p.id}" aria-label="Options for ${p.name}">⚙</button></div>`).join('')}</div>`;
}
function library(g){
  const selected=GROUP_LIBRARY.find(p=>p.id===g.selectedPreset);
  return `<section class="group-preset-section" aria-label="Shared Group library"><div class="row spread" style="margin-bottom:6px"><h3>Conversation workflows</h3><span class="shared-caption">Shared Group library</span></div><p class="small muted" style="margin:0 0 12px">Discuss an answer already in the conversation.</p>${presetCards(g.selectedPreset,'group','workflow')}<h3 style="margin:20px 0 5px">Task presets</h3><p class="small muted" style="margin:0 0 12px">Start a new task, with its own prompts.</p>${presetCards(g.selectedPreset,'group','task')}<div class="preset-start"><button class="primary" data-action="run-preset" ${!selected||g.running||S.contextTooLong?'disabled':''}>${selected?.kind==='workflow'?'Start workflow':selected?.kind==='task'?'Start task':'Start selected'}</button></div></section>`;
}
function positionsFor(g,run){const result=new Map(run.suggestions.map(s=>[s.id,{}]));for(const m of g.messages){if(!run.messageIds.includes(m.id)||m.role!=='assistant')continue;for(const line of m.text.split('\n')){const found=/^STANCE \| (\d+) \| (agree|disagree|revised|withdrawn) \| (.+)$/.exec(line);if(found&&result.has(found[1]))result.get(found[1])[m.seat]={stance:found[2],evidence:found[3],messageId:m.id};}}return result;}
function positionsTable(g,run){const values=positionsFor(g,run);return `<div class="table-scroll"><table aria-label="Recorded positions"><thead><tr><th>Suggestion</th><th>${handle(g,0)}</th><th>${handle(g,1)}</th><th>Evidence</th></tr></thead><tbody>${run.suggestions.map(s=>{const positions=values.get(s.id);const evidence=[...new Set(Object.values(positions).map(p=>p.evidence))].join(' · ');return `<tr><td><strong>${s.id}. ${s.title}</strong></td>${[0,1].map(i=>positions[i]?`<td><button class="position-link ${positions[i].stance}" data-action="position-source" data-message="${positions[i].messageId}">${positions[i].stance}</button></td>`:'<td aria-label="No explicit stance"></td>').join('')}<td><button class="table-evidence" data-action="context">${esc(evidence)}</button></td></tr>`;}).join('')}</tbody></table></div><div class="outcome-foot">Only explicit final stances appear. Blank cells mean no stance was recorded. Select a stance to see the agent’s reply.</div>`;}
function recap(g,run){return `<section class="preset-recap-card" aria-label="${esc(run.entryName)} recap"><div class="recap-title row">${avatar(g.providers[run.recapSeat])}<span>${handle(g,run.recapSeat)} · recap</span><span class="small muted" style="margin-left:auto">${run.entryName}</span></div><div class="preset-recap-body">${format(run.recap)}</div>${run.positions?positionsTable(g,run):''}</section>`;}
function groupDock(){const g=S.group;return `<div class="group-heading"><div class="row spread"><div><div class="group-source-label">${g.forked?'FORKED FROM CLAUDE CHAT':'STARTED IN THE GROUP TAB'}</div><h2>The last ferry · Group</h2></div>${g.forked?'<button class="link small" data-action="source">Source chat ↗</button>':''}</div><div class="participants">${g.providers.map((p,i)=>`<span class="participant-chip">${avatar(p)}<strong>${handle(g,i)}</strong><span class="muted">${esc(modelName(g,i))}</span></span>`).join('')}<button class="link small" style="margin-left:auto" data-action="toggle-presets">Workflows & tasks</button></div></div><div class="chat-scroll" id="chat-scroll">${history(g)}<div class="row spread small muted" style="margin-bottom:16px"><button class="link small" data-action="context">${g.forked?'Full conversation context':'Scenes and files'} ↗</button><span>Current scenes & files</span></div>${S.contextTooLong?'<div class="limit-note">The full context exceeds a selected model’s limit. Choose a model that can receive it before running an agent.</div>':''}${g.showPresets?library(g):''}${!g.messages.length&&!g.running?`<div class="welcome group-empty"><div class="welcome-icon">⌘</div><h2>${g.forked?'Continue with either agent.':'What should we discuss?'}</h2><p>${g.forked?'The conversation is here. No agent has been asked to respond.':'Tag an agent or choose a conversation workflow or task.'}</p><button class="suggestion-chip" data-action="ask-second">@${handle(g,1)} weigh in</button><button class="suggestion-chip" data-action="ask-both">Ask both agents</button>${!g.showPresets?'<div style="margin-top:12px"><button class="link small" data-action="toggle-presets">Choose a conversation workflow</button></div>':''}</div>`:''}${g.messages.map(m=>message(m)).join('')}${g.running?`<div class="running-strip" role="status"><span class="pulse"></span>${g.status}<button data-action="stop">Stop</button></div>`:''}${g.stopped?'<div class="system-note">Discussion stopped. Replies already posted remain in the Group.</div>':''}${g.runs.filter(r=>r.complete).map(r=>recap(g,r)).join('')}</div><form id="group-form" class="composer"><label class="sr-only" for="group-input">Message Group</label><textarea id="group-input" placeholder="@${handle(g,1)}, what do you think?" ${g.running?'disabled':''}></textarea><div class="composer-tools"><span class="small muted">Tag @${handle(g,0)}, @${handle(g,1)}, or @all</span><button class="primary send-button" aria-label="Send Group message" ${g.running?'disabled':''}>Send ↑</button></div></form>`;}
function render(){const draft=$('#group-input')?.value;$('#app').innerHTML=`<main class="workspace"><div class="book-head"><span class="brand-mark">p.</span> proseview</div><div class="editor-head"><span class="small muted">Chapter 04 <span style="padding:0 5px">/</span> The last ferry</span><span class="tag green">✓ Saved</span></div><div class="dock-head"><span class="dock-tab" style="display:grid;place-items:center;font-size:11px">Analysis</span><span class="dock-tab" style="display:grid;place-items:center;font-size:11px">History</span><button class="dock-tab" data-action="codex">Codex</button><button class="dock-tab ${S.view==='source'?'active':''}" data-action="source">Claude</button><button class="dock-tab ${S.view==='group'?'active':''}" data-action="group-tab">Group</button><span class="small muted" style="margin-left:auto;display:flex;align-items:center;gap:5px"><span class="dot"></span>Live</span></div><aside class="sidebar"><div class="book-title">A Map of<br>Small Departures</div><div class="small muted" style="padding:7px 8px">A novel · working draft</div><div class="side-label">Manuscript <span class="count">31,482</span></div><div class="chapter">⌄ &nbsp; Chapter 03</div><div class="scene-link">The empty room</div><div class="scene-link">A borrowed name</div><div class="chapter">⌄ &nbsp; Chapter 04</div><div class="scene-link">The promise</div><div class="scene-link active">The last ferry</div><div class="scene-link">What he kept</div><div class="chapter">› &nbsp; Chapter 05</div><div class="side-label">Project</div><div class="scene-link">Characters</div><div class="scene-link">Story notes</div><div class="scene-link">Timeline</div></aside><article class="editor"><div class="paper-meta">Chapter four · Scene two</div><h1>The last ferry</h1><div class="prose"><span class="line-number">01</span><p>By morning, the city would expect an answer.</p><p>The kettle clicked off. Neither of them moved to pour it. Beyond the glass, the harbor lights shivered in the rain.</p><span class="line-number">10</span><p>Mara stood at the kitchen door with her coat half on.</p><span class="line-number">12</span><p>“If I miss the last ferry, they’ll search the house,” she said.</p><p>Her brother looked at the empty place on the wall where the clock had been. “You could have told me.”</p><span class="line-number">18</span><p>She touched the envelope in her pocket. She pressed its corners flat.</p><p>“I’m telling you now.”</p><p>He set his cup down very carefully. The harbor bell sounded once, then again.</p><span class="line-number">27</span><p>She took the stairs two at a time.<br>For once, the city could wait.</p></div></article><aside class="dock" aria-label="Agent conversation">${S.view==='source'?sourceDock():groupDock()}</aside><footer class="workspace-status"><span>02-the-last-ferry.md · current scene saved</span><span>Illustrative manuscript & simulated agents · local prototype</span></footer></main>`;if(draft&&$('#group-input'))$('#group-input').value=draft;$('#context-example').value=S.contextTooLong?'long':'fits';}
function continuity(){return S.providers[0]===sourceSettings.provider&&S.models[0]===sourceSettings.model?'Original session continues where supported.':'Fresh session with full conversation context.';}
function modelCard(i){return `<div class="model-card"><div class="row">${avatar(S.providers[i])}<strong>${i===0?'First participant':'Second participant'}</strong></div><label for="provider-${i}">Provider<select id="provider-${i}" data-setting="provider" data-seat="${i}"><option value="claude" ${S.providers[i]==='claude'?'selected':''}>Claude</option><option value="codex" ${S.providers[i]==='codex'?'selected':''}>Codex</option></select></label><label for="model-${i}">Model<select id="model-${i}" data-setting="model" data-seat="${i}"><option value="default" ${S.models[i]==='default'?'selected':''}>Project default</option><option value="custom" ${S.models[i]==='custom'?'selected':''}>Custom model…</option></select></label>${S.models[i]==='custom'?`<label for="custom-${i}">Configured model ID<input id="custom-${i}" data-setting="custom" data-seat="${i}" value="${esc(S.custom[i])}" placeholder="Enter a model ID" autocomplete="off"></label>`:''}<p class="participant-note">${i===0?continuity():'New participant with the full conversation.'}</p></div>`;}
function blocked(){return S.models.some((m,i)=>m==='custom'&&!S.custom[i].trim())||(S.contextTooLong&&S.workflow!=='none');}
function renderSetup(focus){$('#setup').innerHTML=`<div class="modal-head"><div class="row spread"><div><h2 id="setup-title">Send to Group</h2><p>Fork this conversation through its latest turn.</p></div><button class="quiet close" data-action="close-setup" aria-label="Close setup">×</button></div></div><div class="modal-content">${S.contextTooLong?'<div class="limit-note" role="alert">The full conversation exceeds a selected model’s context limit. Choose another model before running. You can still fork without starting an agent.</div>':''}<span class="section-label">Participants</span><div class="model-grid">${modelCard(0)}${modelCard(1)}</div><div class="section-heading"><span class="section-label">Conversation workflow</span><span class="shared-caption">Shared with the Group tab</span></div>${presetCards(S.workflow,'setup','workflow',true)}<p class="context-note">Full conversation context comes along, including request prompts, attached sources, current scenes and files, and tool results. <button class="link" data-action="context" data-context-source="source">Inspect context ↗</button><br>Pending approvals and proposals stay in the source chat.</p></div><div class="modal-footer"><p>${S.workflow==='none'?'Nothing runs until you tag an agent.':'Starts the shared conversation workflow.'}</p><div class="row"><button data-action="close-setup">Cancel</button><button class="primary" id="fork-confirm" data-action="fork" ${blocked()?'disabled':''}>${S.workflow==='none'?'Fork to Group':'Fork & run'} ↗</button></div></div>`;if(focus)document.getElementById(focus)?.focus();}
function openSetup(){S.providers=[sourceSettings.provider,sourceSettings.provider==='claude'?'codex':'claude'];S.models=[sourceSettings.model,'default'];S.custom=[sourceSettings.custom,''];S.workflow='none';S.menu=false;renderSetup();if(!$('#setup').open)$('#setup').showModal();}
function openOptions(id){
  const p=GROUP_LIBRARY.find(p=>p.id===id);
  S.optionPreset=id;
  const label=p.kind==='workflow'?'workflow':'task preset';
  $('#preset-options').innerHTML=`<div class="modal-head"><div class="row spread"><div><h2 id="options-title">${p.name}</h2><p>Shared ${label} options · used wherever it starts</p></div><button class="quiet close" data-action="close-options" aria-label="Close options">×</button></div></div><div class="modal-content"><label class="option-check"><input type="checkbox" id="positions-option" ${p.positions?'checked':''}>Include a positions table in the recap</label><p class="option-explanation">${p.kind==='workflow'?'The second opinion numbers the existing suggestions under discussion.':'The first step numbers the suggestions it proposes.'} Reviews keep their finding numbers. Each agent’s final explicit stance and evidence appear in the table. Missing stances stay blank.</p><p class="option-explanation">Stance records stay hidden in the chat. This option applies to future runs from setup and the Group tab.</p></div><div class="modal-footer"><p>Saved in the shared ${label}.</p><button class="primary" data-action="close-options">Done</button></div>`;
  $('#preset-options').showModal();
}
function openContext(requestId=null,fromSource=false){const bundle=fromSource||S.view==='source'?contextBundle():S.group.context;const requests=bundle.messages.filter(m=>m.role==='user'&&m.prompt);$('#context').innerHTML=`<div class="modal-head"><div class="row spread"><div><h2 id="context-title">Context inspector</h2><p>${bundle.messages.length} conversation messages · scenes and files at their current versions</p></div><button class="quiet close" data-action="close-context" aria-label="Close context inspector">×</button></div></div><div class="modal-content"><div class="context-heading">Full request prompts</div>${requests.length?requests.map((m,i)=>`<details ${m.id===requestId?'open':''}><summary>Request ${i+1} · ${esc(m.text)}</summary><pre>${esc(m.prompt)}</pre></details>`).join(''):'<p class="small muted">This Group started directly with the scene and attached files.</p>'}<div class="context-heading">Scenes and attached files · current versions</div>${bundle.files.map(f=>`<details><summary>${esc(f.path)}</summary><pre>${esc(f.body)}</pre></details>`).join('')}<div class="context-heading">Tool results</div>${bundle.tools.map(t=>`<details><summary>${t.name} · ${esc(t.path)}</summary><pre>${esc(t.output)}</pre></details>`).join('')}<p class="context-disclaimer">Full conversation context includes visible messages and the material above. Private model reasoning cannot transfer; model context will not be identical.</p></div><div class="modal-footer"><p>Pending approvals and proposals are excluded.</p><button data-action="close-context">Done</button></div>`;$('#context').showModal();}
function createGroup(forked){return {id:'g'+(++nextId),forked,providers:[...S.providers],models:[...S.models],custom:[...S.custom],context:forked?contextBundle():{messages:[],files:structuredClone(sourceFiles),tools:structuredClone(tools)},showPresets:!forked,selectedPreset:null,messages:[],runs:[],running:false,stopped:false,timer:null,status:''};}
function fork(){if(blocked())return;const g=createGroup(true);S.fork=g;S.group=g;S.view='group';$('#setup').close();render();if(S.workflow!=='none')startEntry(g,S.workflow);}
function scrollBottom(){const e=$('#chat-scroll');if(e)e.scrollTop=e.scrollHeight;}
function addAgent(g,seat,text){const m={id:'m'+(++nextId),role:'assistant',provider:g.providers[seat],seat,model:modelName(g,seat),text};g.messages.push(m);return m;}
const EDITORIAL=[{id:'1',title:'End on the stairs',evidence:'L27–28 · “For once, the city could wait.”'},{id:'2',title:'Cut the envelope gesture',evidence:'L18 · “She touched the envelope in her pocket. She pressed its corners flat.”'},{id:'3',title:'Make the deadline explicit',evidence:'L12 · “If I miss the last ferry, they’ll search the house,” she said.'}];
const TRIM=[{id:'1',title:'Shorten the closing beat',evidence:EDITORIAL[0].evidence},{id:'2',title:'Cut the repeated envelope action',evidence:EDITORIAL[1].evidence}];
function record(run,id,stance){return `STANCE | ${id} | ${stance} | ${run.suggestions.find(s=>s.id===id).evidence}`;}
function taskReply(run,step){const editorial=run.entryId==='editorial_critique';const suggestionList=run.suggestions.map(s=>s.id+'. '+s.title).join('\n');let body,stances=[];if(step===0){body='Suggestions for this discussion:\n\n'+suggestionList+'\n\n'+(editorial?'I prefer the physical ending on the stairs. The envelope gesture could be cut to keep the departure moving. I also want the consequence of waiting to be clear.':'The second envelope action repeats the first. I would also try a shorter ending, keeping Mara’s movement as the last beat.');stances=run.suggestions.map(s=>record(run,s.id,'agree'));}else if(step===1){body=editorial?'I would keep the final sentence: it answers the city’s expectation in the opening. For the envelope, keep the first touch and cut only the repeated handling. The scene already names the consequence of missing the ferry.':'I agree about cutting only the repeated envelope action. I would keep the final city callback; it carries more than an explanation of her movement.';stances=editorial?[record(run,'1','disagree'),record(run,'2','revised')]:[record(run,'1','disagree'),record(run,'2','agree')];}else{body=editorial?'I’m revising the envelope suggestion: keep the first touch, cut the second. I withdraw the request for an explicit deadline; the ferry line already supplies it. I still prefer ending on the stairs.':'We agree on cutting the repeated envelope action. I’m revising my preference for the ending: keep the callback because it connects her private choice with the city.';stances=editorial?[record(run,'1','agree'),record(run,'2','revised'),record(run,'3','withdrawn')]:[record(run,'1','revised'),record(run,'2','agree')];}return body+(run.positions?'\n\n'+stances.join('\n'):'');}

const DISCUSSION=[
  {id:'1',title:'Keep the final city callback',evidence:EDITORIAL[0].evidence},
  {id:'2',title:'Keep one envelope gesture',evidence:EDITORIAL[1].evidence}
];
function workflowReply(run,step){
  let body,stances;
  if(step===0){
    body='I’m weighing in on the answer already in this conversation. The suggestions under discussion are:\n\n'+run.suggestions.map(s=>s.id+'. '+s.title).join('\n')+'\n\n1. I’d challenge keeping the final sentence. Ending on the stairs leaves the choice implicit and gives the exit more momentum.\n\n2. I agree with keeping one envelope gesture. The first touch connects Mara to the object; pressing its corners repeats that action.';
    stances=[record(run,'1','disagree'),record(run,'2','agree')];
  }else{
    body='I still favor keeping the final city callback. The earlier promise makes it more than an explanation of her movement: it keeps her larger obligation in view. That is a difference in emphasis between us.\n\nWe agree about keeping the first envelope touch and cutting the second. I’m keeping that recommendation.';
    stances=[record(run,'1','agree'),record(run,'2','agree')];
  }
  return body+(run.positions?'\n\n'+stances.join('\n'):'');
}

function startEntry(g,id){
  if(g.running||S.contextTooLong)return;
  const p=GROUP_LIBRARY.find(p=>p.id===id);
  if(!p)return;
  const workflow=p.kind==='workflow';
  const run={id:'r'+(++nextId),entryId:id,entryName:p.name,kind:p.kind,positions:p.positions,suggestions:structuredClone(workflow?DISCUSSION:id==='editorial_critique'?EDITORIAL:TRIM),messageIds:[],complete:false,step:0,recapSeat:1};
  const seats=workflow?[1,0]:[0,1,0];
  g.runs.push(run);g.running=true;g.stopped=false;g.showPresets=false;g.selectedPreset=id;
  g.status=p.name+' · '+handle(g,seats[0])+' is replying…';
  render();scrollBottom();
  function advance(){
    if(!g.running)return;
    if(run.step<seats.length){
      const seat=seats[run.step];
      const m=addAgent(g,seat,workflow?workflowReply(run,run.step):taskReply(run,run.step));
      run.messageIds.push(m.id);run.step++;
      g.status=run.step===seats.length?p.name+' · '+handle(g,run.recapSeat)+' is writing the recap…':p.name+' · '+handle(g,seats[run.step])+' is replying…';
      if(S.group===g){render();scrollBottom();}
      g.timer=setTimeout(advance,1050);
    }else{
      run.recap=workflow?'We agree on keeping one envelope gesture and cutting the repeat. We differ on the ending: the original participant favors the city callback; the second opinion favors ending on the stairs. Choose the emphasis you want the close to carry.':id==='editorial_critique'?'Keep one envelope gesture and cut the repeat. The existing ferry line makes the deadline clear. The ending remains a choice between physical momentum and the city callback.':'Cut the repeated envelope action. Keep the city callback, while making the departure around it as lean as possible.';
      run.complete=true;g.running=false;
      if(S.group===g){render();scrollBottom();}
    }
  }
  g.timer=setTimeout(advance,700);
}
function stop(g){clearTimeout(g.timer);g.running=false;g.stopped=true;render();scrollBottom();}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3200);}
function nativeGroup(){
  const g=createGroup(false);
  // Existing sample history lets the direct Group entry demonstrate the same conversation workflow.
  g.messages=[{id:'m'+(++nextId),role:'user',text:'@'+handle(g,0)+', should I keep the city callback and the envelope gesture?',time:'Earlier'},{id:'m'+(++nextId),role:'assistant',provider:g.providers[0],seat:0,model:modelName(g,0),text:'I’d keep the final city callback: the earlier promise gives it weight. I’d also keep one envelope gesture and cut only the repeated handling.',time:'Earlier'}];
  return g;
}
function groupTab(direct=false){if(direct){if(!S.native)S.native=nativeGroup();S.group=S.native;}else S.group=S.fork||S.group||(S.native||(S.native=nativeGroup()));S.view='group';render();}
function proposal(){ $('#proposal').innerHTML='<div class="modal-head"><h2 id="proposal-title">Pending rewrite proposal</h2><p>Source chat only</p></div><div class="modal-content"><blockquote>She touched the envelope in her pocket.</blockquote><p class="small muted">This proposal is still awaiting your decision in the source chat. It is not included in the forked Group.</p></div><div class="modal-footer"><p>The source chat retains this pending item.</p><button data-action="close-proposal">Done</button></div>';$('#proposal').showModal();}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case 'setup':openSetup();break;case 'close-setup':$('#setup').close();break;case 'fork':fork();break;case 'source':S.view='source';render();break;case 'group-tab':groupTab();break;case 'native-group':groupTab(true);break;case 'open-fork':S.group=S.fork;S.view='group';render();break;case 'codex':toast('Use Send to Group to invite Codex into this conversation.');break;case 'toggle-presets':S.group.showPresets=!S.group.showPresets;render();break;case 'select-preset':if(b.dataset.location==='setup'){S.workflow=b.dataset.preset;renderSetup();}else{S.group.selectedPreset=b.dataset.preset;render();}break;case 'preset-options':openOptions(b.dataset.preset);break;case 'close-options':$('#preset-options').close();if($('#setup').open)renderSetup();else render();break;case 'run-preset':startEntry(S.group,S.group.selectedPreset);break;case 'context':openContext(b.dataset.request,b.dataset.contextSource==='source');break;case 'close-context':$('#context').close();break;case 'proposal':proposal();break;case 'close-proposal':$('#proposal').close();break;case 'ask-second':$('#group-input').value='@'+handle(S.group,1)+', what do you think of the ending?';$('#group-input').focus();break;case 'ask-both':$('#group-input').value='@all, what would you keep in this scene?';$('#group-input').focus();break;case 'stop':stop(S.group);break;case 'position-source':{const m=document.getElementById('msg-'+b.dataset.message);m?.scrollIntoView({block:'center'});m?.classList.add('highlight');setTimeout(()=>m?.classList.remove('highlight'),1800);break;}case 'reset':for(const g of [S.group,S.fork,S.native])if(g)clearTimeout(g.timer);GROUP_LIBRARY.forEach(p=>p.positions=false);S=initial();for(const d of document.querySelectorAll('dialog'))d.close();render();break;}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='context-example'){S.contextTooLong=t.value==='long';render();if($('#setup').open)renderSetup();return;}if(t.id==='positions-option'){GROUP_LIBRARY.find(p=>p.id===S.optionPreset).positions=t.checked;return;}if(t.dataset.setting){const i=Number(t.dataset.seat);if(t.dataset.setting==='provider')S.providers[i]=t.value;if(t.dataset.setting==='model')S.models[i]=t.value;if(t.dataset.setting==='custom'){S.custom[i]=t.value;$('#fork-confirm').disabled=blocked();return;}renderSetup(t.id);}});
document.addEventListener('input',event=>{const t=event.target;if(t.dataset.setting==='custom'){S.custom[Number(t.dataset.seat)]=t.value;$('#fork-confirm').disabled=blocked();}});
document.addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(event.key))return;const r=event.target.closest('[role="radio"]');if(!r)return;event.preventDefault();const list=[...r.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]')];const offset=['ArrowDown','ArrowRight'].includes(event.key)?1:-1;const next=list[(list.indexOf(r)+offset+list.length)%list.length];next.click();document.querySelector(`[data-location="${next.dataset.location}"][data-preset="${next.dataset.preset}"]`)?.focus();});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='source-form'){const text=$('#source-input').value.trim();if(!text)return;S.source.push(userMessage(text,'Now'));S.source.push(agentMessage('I’d keep the closing callback and let the surrounding action stay spare.','Now'));render();scrollBottom();return;}if(event.target.id!=='group-form')return;const g=S.group;const text=$('#group-input').value.trim();if(!text||g.running)return;if(S.contextTooLong){toast('The full context will not fit. Choose a model that can receive it before running.');return;}const all=/@all\b/i.test(text);const recipients=[0,1].filter(i=>new RegExp('@'+handle(g,i).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[\\s,.:!?])','i').test(text));if(!all&&!recipients.length){toast('Tag @'+handle(g,0)+', @'+handle(g,1)+', or @all to choose who replies.');return;}g.messages.push({id:'m'+(++nextId),role:'user',text});(all?[0,1]:recipients).forEach(i=>addAgent(g,i,i===0?'I’d keep the city callback, given your preference for an unresolved choice. The earlier promise supports it.':'The last line connects her private departure with the city’s expectation. I’d keep it, and cut only the repeated envelope handling.'));$('#group-input').value='';render();scrollBottom();});
render();
</script>
</body>
</html>
